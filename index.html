    const observationRowsPerPage = () => {
      const rows = Number.parseInt(
        getComputedStyle(observationLibrary).getPropertyValue("--notebook-page-lines"),
        10
      );
      return Number.isFinite(rows) && rows > 0 ? rows : 7;
    };

    const groupedObservationsByLocation = () => {
      const groups = new Map();
      for (const observation of [...observations].sort((a, b) => {
        const titleSort = a.title.localeCompare(b.title, "fr", { sensitivity: "base" });
        if (titleSort !== 0) {
          return titleSort;
        }
        return new Date(b.updatedAt) - new Date(a.updatedAt);
      })) {
        const locationGroup = observation.title || "Sans lieu";
        if (!groups.has(locationGroup)) {
          groups.set(locationGroup, []);
        }
        groups.get(locationGroup).push(observation);
      }
      return groups;
    };

    const observationGroupEntries = () =>
      Array.from(groupedObservationsByLocation(), ([title, groupObservations]) => ({
        title,
        observations: groupObservations,
        count: groupObservations.length
      }));

    const observationColumnsPerPage = 3;

    const observationCardsPerPageWithHeading = (rowsPerPage) => {
      const cardRows = Math.max(1, rowsPerPage - 1);
      return Math.max(observationColumnsPerPage, Math.floor(cardRows / 2) * observationColumnsPerPage);
    };

    const observationGroupRows = (observationCount) =>
      1 + Math.ceil(observationCount / observationColumnsPerPage) * 2;

    const observationGroupChunks = (groupEntries, rowsPerPage) => {
      const chunkCapacity = observationCardsPerPageWithHeading(rowsPerPage);
      return groupEntries.flatMap(({ title, observations: groupObservations, count }) => {
        const parts = Math.max(1, Math.ceil(groupObservations.length / chunkCapacity));
        return Array.from({ length: parts }, (_, index) => {
          const start = index * chunkCapacity;
          const observationsChunk = groupObservations.slice(start, start + chunkCapacity);
          return {
            title,
            count,
            part: index + 1,
            parts,
            observations: observationsChunk,
            rows: observationGroupRows(observationsChunk.length)
          };
        });
      });
    };

    const canUseObservationChunk = (remainingChunks, chunkIndex) => {
      const chunk = remainingChunks[chunkIndex];
      return chunk.part <= 1 || !remainingChunks.some((candidate, index) =>
        index < chunkIndex && candidate.title === chunk.title && candidate.part < chunk.part
      );
    };

    const paginateObservationGroups = (groupEntries, rowsPerPage) => {
      const remainingChunks = observationGroupChunks(groupEntries, rowsPerPage);
      const pages = [];

      const takeChunk = (page, chunkIndex) => {
        const [chunk] = remainingChunks.splice(chunkIndex, 1);
        page.groups.push(chunk);
        page.rows += chunk.rows;
      };

      while (remainingChunks.length) {
        const page = { type: "location-page", groups: [], rows: 0 };
        takeChunk(page, 0);

        while (page.rows < rowsPerPage) {
          const remainingRows = rowsPerPage - page.rows;
          let bestChunkIndex = -1;
          let bestRows = 0;
          for (let chunkIndex = 0; chunkIndex < remainingChunks.length; chunkIndex += 1) {
            const chunk = remainingChunks[chunkIndex];
            if (
              chunk.rows <= remainingRows &&
              chunk.rows > bestRows &&
              canUseObservationChunk(remainingChunks, chunkIndex)
            ) {
              bestChunkIndex = chunkIndex;
              bestRows = chunk.rows;
            }
          }
          if (bestChunkIndex === -1) {
            break;
          }
          takeChunk(page, bestChunkIndex);
        }

        pages.push(page);
      }
      return pages;
    };

    const createObservationHeading = (entry) => {
      const heading = document.createElement("div");
      heading.className = "observation-location-title";
      heading.textContent = entry.title;
      const count = document.createElement("span");
      count.className = "observation-location-count";
      count.textContent = entry.parts > 1
        ? `${entry.count} - ${entry.part}/${entry.parts}`
        : `${entry.count}`;
      heading.appendChild(count);
      return heading;
    };

    const createObservationCard = (observation, renderToken) => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "observation-card";
      const species = speciesForId(observation.speciesId);
      item.setAttribute("aria-label", `${observation.title}, ${species.name}`);
      const thumb = document.createElement("span");
      thumb.className = "species-thumb";
      thumb.setAttribute("aria-label", species.name);
      applySpeciesThumbStyle(thumb, species.id);
      const body = document.createElement("span");
      body.className = "observation-card-body";
      const title = document.createElement("span");
      title.className = "observation-card-title";
      title.textContent = observation.title;
      const schedule = document.createElement("span");
      schedule.className = "observation-card-schedule";
      schedule.textContent = chart.data.length ? "Calcul..." : "Indisponible";
      fishingScheduleLabel(observation)
        .then((label) => {
          if (renderToken === observationRenderToken && schedule.isConnected) {
            schedule.textContent = label;
          }
        })
        .catch((error) => {
          console.warn("Unable to compute fishing schedule", error);
          if (renderToken === observationRenderToken && schedule.isConnected) {
              schedule.textContent = "Créneau indisponible";
          }
        });
      body.append(title, schedule);
      item.append(thumb, body);
      item.addEventListener("click", () => {
        map.flyTo({ center: [observation.lon, observation.lat], zoom: Math.max(map.getZoom(), 15), essential: true });
        openObservationDialog({ lng: observation.lon, lat: observation.lat }, observation);
      });
      return item;
    };

    const createObservationLocationGroup = (group, renderToken) => {
      const groupElement = document.createElement("section");
      groupElement.className = "observation-location-group";
      groupElement.appendChild(createObservationHeading(group));

      const entryGrid = document.createElement("div");
      entryGrid.className = "observation-entry-grid";
      for (const observation of group.observations) {
        entryGrid.appendChild(createObservationCard(observation, renderToken));
      }
      groupElement.appendChild(entryGrid);
      return groupElement;
    };

    const createObservationLocationPage = (page, renderToken) => {
      const pageContent = document.createElement("section");
      pageContent.className = "observation-location-page";
      for (const group of page.groups) {
        pageContent.appendChild(createObservationLocationGroup(group, renderToken));
      }
      return pageContent;
    };

    const updateObservationPageControls = (pageCount) => {
      const hasPages = pageCount > 0;
      observationPagePrev.disabled = !hasPages || observationLibraryPage <= 0;
      observationPageNext.disabled = !hasPages || observationLibraryPage >= pageCount - 1;
      observationPageLabel.textContent = hasPages
        ? `Page ${observationLibraryPage + 1} / ${pageCount}`
        : "Page 0 / 0";
    };

    const renderObservationLibrary = () => {
      const renderToken = ++observationRenderToken;
      observationList.replaceChildren();
      if (!observations.length) {
        observationLibraryPage = 0;
        const empty = document.createElement("div");
        empty.className = "observation-empty";
        empty.textContent = "Aucune observation";
        observationList.appendChild(empty);
        updateObservationPageControls(0);
        return;
      }

      const groupEntries = observationGroupEntries();
      const rowsPerPage = observationRowsPerPage();
      const pages = paginateObservationGroups(groupEntries, rowsPerPage);
      observationLibraryPage = Math.max(0, Math.min(observationLibraryPage, pages.length - 1));
      const page = pages[observationLibraryPage] ?? [];

      if (page.type === "location-page") {
        observationList.appendChild(createObservationLocationPage(page, renderToken));
      }
      updateObservationPageControls(pages.length);
    };

    const setObservationLibraryOpen = (open) => {
      const wasHidden = observationLibrary.hidden;
      observationLibrary.hidden = !open;
      maregramContent.hidden = open;
      observationLibraryToggle.classList.toggle("view-switch-button-active", open);
      observationLibraryToggle.setAttribute("aria-pressed", String(open));
      observationLibraryToggle.textContent = open ? "Marée" : "Carnet";
      if (open) {
        if (wasHidden) {
          observationLibraryPage = 0;
        }
        renderObservationLibrary();
      }
      if (!calendarPanel.hidden) {
        positionCalendar();
      }
    };

    const renderSpeciesGrid = () => {
      observationSpeciesGrid.replaceChildren();
      for (const species of speciesAtlas) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "species-option";
        button.dataset.speciesId = species.id;
        button.setAttribute("aria-label", species.name);
        const image = document.createElement("span");
        image.className = "species-option-image";
        applySpeciesThumbStyle(image, species.id);
        const name = document.createElement("span");
        name.className = "species-option-name";
        name.textContent = species.name;
        button.append(image, name);
        button.addEventListener("click", () => {
          pendingObservationSpeciesId = species.id;
          if (!pendingObservationConditionTouched) {
            const defaults = defaultFishingConditionForSpecies(species.id);
            pendingObservationWaterState = defaults.waterState;
            pendingObservationMinWaterDepthCm = defaults.minWaterDepthCm;
          }
          updateSpeciesSelection();
          updateFishingConditionControls();
        });
        observationSpeciesGrid.appendChild(button);
      }
    };

    const updateSpeciesSelection = () => {
      observationSpeciesGrid.querySelectorAll(".species-option").forEach((button) => {
        const selected = button.dataset.speciesId === pendingObservationSpeciesId;
        button.classList.toggle("species-option-selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
    };

    const updateFishingConditionControls = () => {
      const isWet = pendingObservationWaterState === "wet";
      observationDry.classList.toggle("condition-option-active", !isWet);
      observationWet.classList.toggle("condition-option-active", isWet);
      observationDry.setAttribute("aria-pressed", String(!isWet));
      observationWet.setAttribute("aria-pressed", String(isWet));
      observationWaterDepthField.hidden = !isWet;
      observationWaterDepth.value = String(clampWaterDepthCm(pendingObservationMinWaterDepthCm));
      observationWaterDepthValue.textContent = `${clampWaterDepthCm(pendingObservationMinWaterDepthCm)} cm`;
    };

    const setPendingFishingCondition = (waterState) => {
      pendingObservationConditionTouched = true;
      pendingObservationWaterState = normalizeWaterState(waterState);
      if (pendingObservationWaterState === "wet" && pendingObservationMinWaterDepthCm <= 0) {
        pendingObservationMinWaterDepthCm = 50;
      }
      updateFishingConditionControls();
    };

    const openObservationDialog = (lngLat, observation = null) => {
      activeObservationId = observation?.id ?? null;
      pendingObservationLngLat = { lng: Number(lngLat.lng), lat: Number(lngLat.lat) };
      observationDialogTitle.textContent = observation ? "Modifier l'observation" : "Nouvelle observation";
      observationPosition.textContent = `${pendingObservationLngLat.lat.toFixed(6)}, ${pendingObservationLngLat.lng.toFixed(6)}`;
      observationTitle.value = observation?.title ?? "";
      pendingObservationSpeciesId = speciesForId(observation?.speciesId).id;
      const defaults = defaultFishingConditionForSpecies(pendingObservationSpeciesId);
      pendingObservationWaterState = observation?.waterState ? normalizeWaterState(observation.waterState) : defaults.waterState;
      pendingObservationMinWaterDepthCm = observation?.minWaterDepthCm == null
        ? defaults.minWaterDepthCm
        : clampWaterDepthCm(observation.minWaterDepthCm);
      pendingObservationConditionTouched = Boolean(observation);
      updateSpeciesSelection();
      updateFishingConditionControls();
      observationDelete.hidden = !observation;
      observationDialog.hidden = false;
      observationTitle.focus();
    };

    const closeObservationDialog = () => {
      observationDialog.hidden = true;
      activeObservationId = null;
      pendingObservationLngLat = null;
      observationForm.reset();
      pendingObservationSpeciesId = defaultSpeciesId;
      pendingObservationWaterState = "dry";
      pendingObservationMinWaterDepthCm = 50;
      pendingObservationConditionTouched = false;
      updateSpeciesSelection();
      updateFishingConditionControls();
    };

    const saveObservationFromForm = () => {
      const title = observationTitle.value.trim();
      if (!title || !pendingObservationLngLat) {
        return;
      }

      const now = new Date().toISOString();
      const existingIndex = observations.findIndex((item) => item.id === activeObservationId);
      const existing = existingIndex >= 0 ? observations[existingIndex] : null;
      const observation = {
        id: existing?.id ?? createObservationId(),
        title,
        speciesId: speciesForId(pendingObservationSpeciesId).id,
        waterState: normalizeWaterState(pendingObservationWaterState),
        minWaterDepthCm: normalizeWaterState(pendingObservationWaterState) === "wet"
          ? clampWaterDepthCm(pendingObservationMinWaterDepthCm)
          : 0,
        lat: pendingObservationLngLat.lat,
        lon: pendingObservationLngLat.lng,
        createdAt: existing?.createdAt ?? now,
        updatedAt: now
      };

      if (existingIndex >= 0) {
        observations.splice(existingIndex, 1, observation);
      } else {
        observations.push(observation);
      }

      saveObservations();
      updateObservationSource();
      renderObservationLibrary();
      closeObservationDialog();
    };

    const deleteActiveObservation = () => {
      if (!activeObservationId) {
        return;
      }
      observations = observations.filter((item) => item.id !== activeObservationId);
      saveObservations();
      updateObservationSource();
      renderObservationLibrary();
      closeObservationDialog();
    };

    const speciesIconExpression = [
      "match",
      ["get", "speciesId"],
      ...speciesAtlas.flatMap((species) => [species.id, `species-${species.id}`]),
      `species-${defaultSpeciesId}`
    ];

    const loadSpeciesAtlasImage = () => new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error("Atlas d'especes indisponible"));
      image.src = speciesAtlasUrl;
    });

    const addSpeciesMarkerImages = async () => {
      const image = await loadSpeciesAtlasImage();
      const cellWidth = image.naturalWidth / speciesAtlasColumns;
      const cellHeight = image.naturalHeight / speciesAtlasRows;
      for (const species of speciesAtlas) {
        const imageId = `species-${species.id}`;
        if (map.hasImage(imageId)) {
          continue;
        }
        const size = 80;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const context = canvas.getContext("2d");
        if (!context) {
          continue;
        }
        const sourceX = species.col * cellWidth;
        const sourceY = species.row * cellHeight;
        context.clearRect(0, 0, size, size);
        context.drawImage(image, sourceX, sourceY, cellWidth, cellHeight, 0, 0, size, size);
        map.addImage(imageId, context.getImageData(0, 0, size, size), { pixelRatio: 2 });
      }
    };

    const setMaregramStatus = (message = "") => {
      maregramStatus.textContent = message;
    };

    const selectedHarbor = () => harbors.find((site) => site.cst === tideStation.value);

    const selectedZhToDemOffset = () => {
      const station = selectedHarbor();
      return zhToDemOffsetByHarbor[tideStation.value] ??
        zhToDemOffsetByHarbor[station?.ch_ref] ??
        defaultZhToDemOffset;
    };

    const isLeapYear = (year) => new Date(year, 1, 29).getMonth() === 1;

    const coefficientDuration = (year, month) => {
      const referenceYear = month > 2 ? year + 1 : year;
      return isLeapYear(referenceYear) ? "366" : "365";
    };

    const formatCoefficient = (values) => {
      if (!values.length) {
        return "Coeff --";
      }
      const uniqueValues = values.filter((value, index) => index === 0 || value !== values[index - 1]);
      return `Coeff ${uniqueValues.join(" / ")}`;
    };

    const daysInMonth = (year, month) => new Date(year, month, 0).getDate();

    const selectedInputDate = () => dateFromInput(tideDate.value || todayString());

    const coefficientBackground = (values) => {
      const finiteValues = values.filter((value) => Number.isFinite(value));
      if (!finiteValues.length) {
        return "#f8fafc";
      }
      const maxValue = Math.max(...finiteValues);
      const ratio = Math.max(0, Math.min(1, (maxValue - 35) / 65));
      const hue = 190 - ratio * 135;
      const saturation = 52 + ratio * 10;
      const lightness = 77 - ratio * 3;
      return `hsl(${hue.toFixed(0)}, ${saturation.toFixed(0)}%, ${lightness.toFixed(0)}%)`;
    };

    const calendarDayLabel = (date) => {
      const weekday = calendarWeekdayFormatter.format(date).replace(".", "");
      return `${date.getDate()} ${weekday}`;
    };

    const monthCacheKey = (year, month) => `${tideStation.value}:${year}-${String(month).padStart(2, "0")}`;

    const fetchStaticTideCalendar = async (station) => {
      const path = `data/shom/${encodeURIComponent(station)}.json`;
      if (!shomStaticCache.has(path)) {
        shomStaticCache.set(path, fetch(path).then((response) => {
          if (!response.ok) {
            throw new Error(`static tide calendar HTTP ${response.status}`);
          }
          return response.json();
        }));
      }
      return shomStaticCache.get(path);
    };

    const tideRowsFromPayload = (payload) => {
      const rows = Object.entries(payload).flatMap(([date, values]) =>
        values.map(([time, height]) => ({
          time: new Date(`${date}T${time}`),
          height: Number(height)
        }))
      );
      if (!rows.length) {
        throw new Error("empty tide response");
      }
      return rows;
    };

    const staticWaterLevelsForDate = (calendar, dateString) => {
      const rows = calendar.waterLevels?.[dateString];
      if (!Array.isArray(rows) || !rows.length) {
        throw new Error("no static water levels for date");
      }
      const normalizeClockTime = (value) => {
        const parts = String(value).split(":");
        if (parts.length < 2) {
          return "00:00:00";
        }
        return `${parts[0].padStart(2, "0")}:${parts[1].padStart(2, "0")}:${(parts[2] ?? "00").padStart(2, "0")}`;
      };
      const points = rows
        .map((row) => {
          const time = Array.isArray(row) ? row[0] : row.time;
          const height = Array.isArray(row) ? row[1] : row.height;
          const timestamp = String(time).includes("T")
            ? new Date(time)
            : new Date(`${dateString}T${normalizeClockTime(time)}`);
          return {
            time: timestamp,
            height: Number(height)
          };
        })
        .filter((point) => Number.isFinite(point.height) && !Number.isNaN(point.time.getTime()));
      if (!points.length) {
        throw new Error("empty static water levels for date");
      }
      return points;
    };

    const fetchMonthlyCoefficients = async (year, month) => {
      const cacheKey = monthCacheKey(year, month);
      if (monthCoefficientCache.has(cacheKey)) {
        return monthCoefficientCache.get(cacheKey);
      }
      if (useStaticShom) {
        const monthKey = `${year}-${String(month).padStart(2, "0")}`;
        const payload = await fetchStaticTideCalendar(tideStation.value);
        const rows = Array.from({ length: daysInMonth(year, month) }, (_, index) => {
          const values = Array.isArray(payload?.coefficients?.[monthKey]?.[index]) ? payload.coefficients[monthKey][index] : [];
          return values
            .map((value) => Number(value))
            .filter((value) => Number.isFinite(value));
        });
        monthCoefficientCache.set(cacheKey, rows);
        return rows;
      }
      const station = selectedHarbor();
      const url = new URL(`${shomProxyBase}/shom/coeff`);
      url.search = new URLSearchParams({
        harborName: tideStation.value,
        duration: String(daysInMonth(year, month)),
        date: `${year}-${String(month).padStart(2, "0")}-01`,
        utc: String(Number(station?.ut ?? 10) / 10),
        correlation: "1"
      });

      const response = await fetch(url);
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(`SHOM coeff HTTP ${response.status}`);
      }
      const rows = Array.from({ length: daysInMonth(year, month) }, (_, index) => {
        const values = Array.isArray(payload?.[0]?.[index]) ? payload[0][index] : [];
        return values
          .map((value) => Number(value))
          .filter((value) => Number.isFinite(value));
      });
      monthCoefficientCache.set(cacheKey, rows);
      return rows;
    };

    const renderCalendarMonth = (year, month, monthCoefficients) => {
      const selected = selectedInputDate();
      const dayCount = daysInMonth(year, month);
      const daysPerColumn = Math.ceil(dayCount / 3);
      calendarGrid.replaceChildren();

      for (let columnIndex = 0; columnIndex < 3; columnIndex += 1) {
        const column = document.createElement("div");
        column.className = "calendar-column";

        const header = document.createElement("div");
        header.className = "calendar-column-head";
        header.innerHTML = "<span>Date</span><span>Coeff</span>";
        column.appendChild(header);

        const startDay = columnIndex * daysPerColumn + 1;
        const endDay = Math.min(dayCount, startDay + daysPerColumn - 1);
        for (let day = startDay; day <= endDay; day += 1) {
          const date = new Date(year, month - 1, day);
          const values = monthCoefficients[day - 1] ?? [];
          const button = document.createElement("button");
          button.type = "button";
          button.className = "calendar-day";
          button.style.background = coefficientBackground(values);
          button.dataset.date = inputDateString(date);
          button.setAttribute("aria-label", `${calendarDayLabel(date)}, ${formatCoefficient(values)}`);
          button.setAttribute("aria-pressed", String(
            selected.getFullYear() === year &&
            selected.getMonth() === month - 1 &&
            selected.getDate() === day
          ));
          if (button.getAttribute("aria-pressed") === "true") {
            button.classList.add("calendar-day-selected");
          }

          const label = document.createElement("span");
          label.className = "calendar-day-name";
          label.textContent = calendarDayLabel(date);

          const coeff = document.createElement("span");
          coeff.className = "calendar-day-coeff";
          coeff.textContent = values.length ? values.join("\n") : "--";

          button.append(label, coeff);
          button.addEventListener("click", () => {
            tideDate.value = button.dataset.date;
            updateDateButton();
            calendarPanel.hidden = true;
            loadMaregram();
          });
          column.appendChild(button);
        }

        calendarGrid.appendChild(column);
      }
    };

    const renderCalendar = async () => {
      const date = calendarMonthDate ?? new Date(selectedInputDate().getFullYear(), selectedInputDate().getMonth(), 1);
      calendarMonthDate = new Date(date.getFullYear(), date.getMonth(), 1);
      const year = calendarMonthDate.getFullYear();
      const month = calendarMonthDate.getMonth() + 1;
      const renderToken = ++calendarRenderToken;

      calendarMonth.textContent = calendarMonthFormatter.format(calendarMonthDate);
      calendarGrid.replaceChildren();
      const loading = document.createElement("div");
      loading.className = "calendar-loading";
      loading.textContent = "Chargement des coefficients";
      calendarGrid.appendChild(loading);

      try {
        const monthCoefficients = await fetchMonthlyCoefficients(year, month);
        if (renderToken !== calendarRenderToken) {
          return;
        }
        renderCalendarMonth(year, month, monthCoefficients);
      } catch (error) {
        if (renderToken !== calendarRenderToken) {
          return;
        }
        calendarGrid.replaceChildren();
        const message = document.createElement("div");
        message.className = "calendar-loading";
        message.textContent = `Coefficients indisponibles (${error.message})`;
        calendarGrid.appendChild(message);
      }
    };

    const positionCalendar = () => {
      const isCompactViewport = window.matchMedia("(max-width: 700px), (max-height: 520px) and (orientation: landscape)").matches;
      if (isCompactViewport) {
        calendarPanel.style.removeProperty("--calendar-left");
        calendarPanel.style.removeProperty("--calendar-bottom");
        const panelRect = maregramPanel.getBoundingClientRect();
        const bottom = Math.max(8, window.innerHeight - panelRect.top + 3);
        const safeTop = 74;
        const isLandscapeCompact = window.matchMedia("(max-height: 520px) and (orientation: landscape)").matches;
        const maxHeight = isLandscapeCompact ? 230 : (window.matchMedia("(max-width: 430px)").matches ? 314 : 324);
        const minHeight = isLandscapeCompact ? 150 : 238;
        const availableHeight = Math.max(minHeight, panelRect.top - safeTop - 3);
        const height = Math.min(maxHeight, availableHeight);
        calendarPanel.style.setProperty("--calendar-mobile-bottom", `${Math.round(bottom)}px`);
        calendarPanel.style.setProperty("--calendar-mobile-height", `${Math.round(height)}px`);
        return;
      }

      calendarPanel.style.removeProperty("--calendar-mobile-bottom");
      calendarPanel.style.removeProperty("--calendar-mobile-height");
      const rect = datePickerButton.getBoundingClientRect();
      const calendarWidth = Math.min(410, window.innerWidth - 32);
      const left = Math.max(12, Math.min(rect.left, window.innerWidth - calendarWidth - 12));
      const bottom = Math.max(12, window.innerHeight - rect.top + 8);
      calendarPanel.style.setProperty("--calendar-left", `${Math.round(left)}px`);
      calendarPanel.style.setProperty("--calendar-bottom", `${Math.round(bottom)}px`);
    };

    const openCalendar = () => {
      const date = selectedInputDate();
      calendarMonthDate = new Date(date.getFullYear(), date.getMonth(), 1);
      positionCalendar();
      calendarPanel.hidden = false;
      renderCalendar();
    };

    const shiftCalendarMonth = (months) => {
      const date = calendarMonthDate ?? new Date(selectedInputDate().getFullYear(), selectedInputDate().getMonth(), 1);
      calendarMonthDate = new Date(date.getFullYear(), date.getMonth() + months, 1);
      renderCalendar();
    };

    const setMaregramReadout = (point) => {
      const demLevel = point.height + selectedZhToDemOffset();
      maregramTime.textContent = point.time.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      maregramHeight.textContent = `Marée ${point.height.toFixed(2)} m`;
      setTideLevel(demLevel, point.height);
    };

    const clearActiveTideEvent = () => {
      tideEvents.querySelectorAll(".tide-event-active").forEach((node) => {
        node.classList.remove("tide-event-active");
      });
    };

    const setMaregramCursorPoint = (point, activeEvent = null) => {
      if (!chart.plot || !chart.cursorLine || !chart.cursorPoint || !chart.x || !chart.y) {
        return;
      }
      const { left, right } = chart.plot;
      const x = Math.max(left, Math.min(right, chart.x(point.time)));
      const y = chart.y(point.height);
      chart.active = point;
      chart.cursorLine.setAttribute("x1", x);
      chart.cursorLine.setAttribute("x2", x);
      chart.cursorPoint.setAttribute("cx", x);
      chart.cursorPoint.setAttribute("cy", y);
      setMaregramReadout(point);
      clearActiveTideEvent();
      activeEvent?.classList.add("tide-event-active");
    };

    const formatEventTime = (time) =>
      time.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

    const tideEventType = (type) => type === "high" ? "Pleine mer" : "Basse mer";

    const extractTideEvents = (data) => {
      const events = [];
      for (let index = 1; index < data.length - 1; index += 1) {
        const previous = data[index - 1].height;
        const current = data[index].height;
        const next = data[index + 1].height;
        if ((current >= previous && current > next) || (current > previous && current >= next)) {
          events.push({ ...data[index], type: "high" });
        } else if ((current <= previous && current < next) || (current < previous && current <= next)) {
          events.push({ ...data[index], type: "low" });
        }
      }
      const groups = [];
      for (const event of events) {
        const previous = groups[groups.length - 1];
        const isSameEvent = previous &&
          previous.type === event.type &&
          event.time.getTime() - previous.endTime.getTime() <= 45 * 60000;
        if (isSameEvent) {
          previous.endTime = event.time;
          previous.points.push(event);
        } else {
          groups.push({
            type: event.type,
            endTime: event.time,
            points: [event]
          });
        }
      }
      return groups.map((group) => {
        const points = group.points;
        const best = points.reduce((selected, point) => {
          if (group.type === "high") {
            return point.height > selected.height ? point : selected;
          }
          return point.height < selected.height ? point : selected;
        }, points[0]);
        const first = points[0].time.getTime();
        const last = points[points.length - 1].time.getTime();
        return {
          type: group.type,
          time: new Date((first + last) / 2),
          height: best.height
        };
      });
    };

    const renderTideEvents = (events) => {
      tideEvents.replaceChildren();
      for (const event of events.slice(0, 4)) {
        const item = document.createElement("button");
        item.type = "button";
        item.className = `tide-event tide-event-${event.type}`;
        item.setAttribute("aria-label", `${tideEventType(event.type)} ${formatEventTime(event.time)} ${event.height.toFixed(2)} m`);
        item.innerHTML = `
          <span class="tide-event-type">${tideEventType(event.type)}</span>
          <span class="tide-event-time">${formatEventTime(event.time)}</span>
          <span class="tide-event-height">${event.height.toFixed(2)} m</span>
        `;
        item.addEventListener("click", () => setMaregramCursorPoint(event, item));
        tideEvents.appendChild(item);
      }
    };

    const generateDemoTide = (dateString) => {
      const [year, month, day] = dateString.split("-").map(Number);
      const start = new Date(year, month - 1, day, 0, 0, 0);
      const dayPhase = (Date.UTC(year, month - 1, day) / 86400000) % 29.53;
      const phase = (dayPhase / 29.53) * Math.PI * 2;
      return Array.from({ length: 145 }, (_, index) => {
        const minutes = index * 10;
        const time = new Date(start.getTime() + minutes * 60000);
        const hours = minutes / 60;
        const height = Math.max(
          0.15,
          3.05 +
            2.25 * Math.cos(((hours - 4.4) / 12.42) * Math.PI * 2 + phase) +
            0.35 * Math.cos(((hours - 8) / 24.84) * Math.PI * 2 + phase * 0.45)
        );
        return { time, height };
      });
    };

    const shiftedDateString = (dateString, dayDelta) => {
      const [year, month, day] = dateString.split("-").map(Number);
      const date = new Date(year, month - 1, day + dayDelta);
      return inputDateString(date);
    };

    const tideEventsFromRows = (dateString, rows) => rows
      .filter(([type]) => type === "tide.high" || type === "tide.low")
      .map(([type, time, height]) => ({
        type: type === "tide.high" ? "high" : "low",
        time: new Date(`${dateString}T${time}:00`),
        height: Number(height)
      }))
      .filter((event) => Number.isFinite(event.height) && !Number.isNaN(event.time.getTime()));

    const staticTideEventsAroundDate = (calendar, dateString) => [-1, 0, 1]
      .flatMap((offset) => {
        const key = shiftedDateString(dateString, offset);
        return tideEventsFromRows(key, calendar.events?.[key] ?? []);
      })
      .sort((a, b) => a.time - b.time);

    const interpolateTideBetweenExtrema = (dateString, events) => {
      const [year, month, day] = dateString.split("-").map(Number);
      const start = new Date(year, month - 1, day, 0, 0, 0);
      const points = [];
      let eventIndex = 1;

      for (let index = 0; index <= 144; index += 1) {
        const time = new Date(start.getTime() + index * 10 * 60000);
        while (eventIndex < events.length && events[eventIndex].time < time) {
          eventIndex += 1;
        }
        const previous = events[eventIndex - 1];
        const next = events[eventIndex];
        if (!previous || !next) {
          throw new Error("missing surrounding tide extrema");
        }
        const span = next.time.getTime() - previous.time.getTime();
        const ratio = span > 0 ? (time.getTime() - previous.time.getTime()) / span : 0;
        const eased = (1 - Math.cos(Math.PI * Math.max(0, Math.min(1, ratio)))) * 0.5;
        points.push({
          time,
          height: previous.height + (next.height - previous.height) * eased
        });
      }

      return points;
    };

    const populateStations = (sites) => {
      const current = tideStation.value;
      harbors = sites;
      tideStation.replaceChildren();
      for (const site of sites) {
        const option = document.createElement("option");
        option.value = site.cst;
        option.textContent = site.toponyme;
        tideStation.appendChild(option);
      }
      if (sites.some((site) => site.cst === current)) {
        tideStation.value = current;
      } else if (sites.length) {
        tideStation.value = sites[0].cst;
      }
    };

    const stationDistance = (site, center) => {
      const lat = Number(site.lat);
      const lon = Number(site.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        return Infinity;
      }
      const latDelta = lat - center.lat;
      const lonDelta = (lon - center.lng) * Math.cos((center.lat * Math.PI) / 180);
      return latDelta * latDelta + lonDelta * lonDelta;
    };

    const selectNearestStation = () => {
      if (!harbors.length) {
        return false;
      }
      const center = map.getCenter();
      const nearest = harbors.reduce((best, site) => {
        const distance = stationDistance(site, center);
        return distance < best.distance ? { site, distance } : best;
      }, { site: null, distance: Infinity }).site;
      if (!nearest || tideStation.value === nearest.cst) {
        return false;
      }
      tideStation.value = nearest.cst;
      monthCoefficientCache.clear();
      if (!calendarPanel.hidden) {
        renderCalendar();
      }
      return true;
    };

    const loadStations = async () => {
      populateStations(bundledStations);
      if (useStaticShom) {
        return;
      }
      try {
        const response = await fetch(`${shomProxyBase}/shom/harbors`);
        const payload = await response.json();
        const sites = payload.features
          .map((feature) => feature.properties)
          .filter((site) => site.cache === 1 && site.h_legale === 1 && site.ut !== null)
          .sort((a, b) => a.toponyme.localeCompare(b.toponyme, "fr"));
        populateStations(sites);
      } catch {
        setMaregramStatus("Ports SHOM indisponibles");
      }
    };

    const fetchTideData = async () => {
      if (useStaticShom) {
        const calendar = await fetchStaticTideCalendar(tideStation.value);
        if (calendar.waterLevels?.[tideDate.value]) {
          return staticWaterLevelsForDate(calendar, tideDate.value);
        }
        const events = staticTideEventsAroundDate(calendar, tideDate.value);
        return interpolateTideBetweenExtrema(tideDate.value, events);
      }

      const url = new URL(`${shomProxyBase}/shom/wl`);
      url.search = new URLSearchParams({
        harborName: tideStation.value,
        duration: "1",
        date: tideDate.value,
        utc: "standard",
        nbWaterLevels: "288"
      });

      const response = await fetch(url);
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(`SHOM HTTP ${response.status}`);
      }
      return tideRowsFromPayload(payload);
    };

    const fetchTideEvents = async () => {
      let payload;
      if (useStaticShom) {
        payload = await fetchStaticTideCalendar(tideStation.value);
        const events = tideEventsFromRows(tideDate.value, payload.events?.[tideDate.value] ?? []);
        if (events.length) {
          return events;
        }
        if (payload.waterLevels?.[tideDate.value]) {
          return extractTideEvents(staticWaterLevelsForDate(payload, tideDate.value));
        }
        return events;
      } else {
        const url = new URL(`${shomProxyBase}/shom/hlt`);
        url.search = new URLSearchParams({
          harborName: tideStation.value,
          duration: "7",
          date: tideDate.value,
          utc: "standard",
          correlation: "1"
        });

        const response = await fetch(url);
        payload = await response.json();
        if (!response.ok) {
          throw new Error(`SHOM HLT HTTP ${response.status}`);
        }
      }
      return tideEventsFromRows(tideDate.value, payload[tideDate.value] ?? []);
    };

    const fetchCoefficient = async () => {
      const [year, month, day] = tideDate.value.split("-").map(Number);
      const monthRows = await fetchMonthlyCoefficients(year, month);
      return (monthRows[day - 1] ?? [])
        .map((value) => Number(value))
        .filter((value) => Number.isFinite(value));
    };

    const interpolatePoint = (timeMs) => {
      const data = chart.data;
      if (timeMs <= data[0].time.getTime()) {
        return data[0];
      }
      if (timeMs >= data[data.length - 1].time.getTime()) {
        return data[data.length - 1];
      }
      let index = 1;
      while (index < data.length && data[index].time.getTime() < timeMs) {
        index += 1;
      }
      const previous = data[index - 1];
      const next = data[index];
      const t = (timeMs - previous.time.getTime()) / (next.time.getTime() - previous.time.getTime());
      return {
        time: new Date(timeMs),
        height: previous.height + (next.height - previous.height) * t
      };
    };

    const updateMaregramCursor = (clientX) => {
      if (!chart.data.length) {
        return;
      }
      const { left, right, top, bottom } = chart.plot;
      const rect = maregramChart.getBoundingClientRect();
      if (rect.width <= 0) {
        const start = chart.data[0].time.getTime();
        const end = chart.data[chart.data.length - 1].time.getTime();
        setMaregramCursorPoint(interpolatePoint(start + (end - start) * 0.5));
        return;
      }
      const viewX = ((clientX - rect.left) / rect.width) * chart.width;
      const x = Math.max(left, Math.min(right, viewX));
      const start = chart.data[0].time.getTime();
      const end = chart.data[chart.data.length - 1].time.getTime();
      const point = interpolatePoint(start + ((x - left) / (right - left)) * (end - start));
      setMaregramCursorPoint(point);
    };

    const isInsideMaregramPlotBand = (event) => {
      if (!chart.plot) {
        return false;
      }
      const rect = maregramChart.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) {
        return false;
      }
      const viewY = ((event.clientY - rect.top) / rect.height) * chart.height;
      return viewY >= chart.plot.top - 10 && viewY <= chart.plot.bottom + 10;
    };

    const updateMaregramCursorFromPointer = (event, force = false) => {
      const currentPointer = { x: event.clientX, y: event.clientY };
      if (!force) {
        const previousPointer = chart.lastPointer;
        chart.lastPointer = currentPointer;
        if (!previousPointer || !isInsideMaregramPlotBand(event)) {
          return;
        }
        const dx = Math.abs(currentPointer.x - previousPointer.x);
        const dy = Math.abs(currentPointer.y - previousPointer.y);
        if (dx < 1 || dy > dx * 0.65) {
          return;
        }
      } else {
        chart.lastPointer = currentPointer;
      }
      updateMaregramCursor(event.clientX);
    };

    const renderMaregram = (data, tideEventData = null) => {
      chart.data = data;
      renderTideEvents(tideEventData?.length ? tideEventData : extractTideEvents(data));
      if (!observationLibrary.hidden) {
        renderObservationLibrary();
      }
      maregramChart.replaceChildren();
      const { width, height, margin } = chart;
      const left = margin.left;
      const right = width - margin.right;
      const top = margin.top;
      const bottom = height - margin.bottom;
      chart.plot = { left, right, top, bottom };

      const minTime = data[0].time.getTime();
      const maxTime = data[data.length - 1].time.getTime();
      const minHeight = Math.floor(Math.min(...data.map((point) => point.height)) - 0.25);
      const maxHeight = Math.ceil(Math.max(...data.map((point) => point.height)) + 0.25);
      const xFor = (time) => left + ((time.getTime() - minTime) / (maxTime - minTime)) * (right - left);
      const yFor = (value) => bottom - ((value - minHeight) / (maxHeight - minHeight)) * (bottom - top);
      chart.x = xFor;
      chart.y = yFor;

      for (let hour = 0; hour <= 24; hour += 3) {
        const x = left + (hour / 24) * (right - left);
        maregramChart.appendChild(svgNode("text", { x, y: height - 8, "text-anchor": "middle", fill: "#475569", "font-size": "11" })).textContent = String(hour);
      }

      for (let value = minHeight; value <= maxHeight; value += Math.max(1, Math.ceil((maxHeight - minHeight) / 5))) {
        const y = yFor(value);
        maregramChart.appendChild(svgNode("text", { x: left - 8, y: y + 4, "text-anchor": "end", fill: "#475569", "font-size": "11" })).textContent = value.toFixed(0);
      }

      maregramChart.appendChild(svgNode("line", { x1: left, y1: bottom, x2: right, y2: bottom, class: "maregram-axis" }));
      maregramChart.appendChild(svgNode("line", { x1: left, y1: top, x2: left, y2: bottom, class: "maregram-axis" }));

      const path = data
        .map((point, index) => `${index === 0 ? "M" : "L"} ${xFor(point.time).toFixed(2)} ${yFor(point.height).toFixed(2)}`)
        .join(" ");
      const area = `${path} L ${right} ${bottom} L ${left} ${bottom} Z`;
      maregramChart.appendChild(svgNode("path", { d: area, class: "maregram-water" }));
      maregramChart.appendChild(svgNode("path", { d: path, class: "maregram-path" }));

      chart.cursorLine = svgNode("line", { y1: top, y2: bottom, class: "maregram-cursor" });
      chart.cursorPoint = svgNode("circle", { r: 4.5, class: "maregram-point" });
      maregramChart.appendChild(chart.cursorLine);
      maregramChart.appendChild(chart.cursorPoint);

      chart.lastPointer = null;
      maregramChart.onpointerenter = (event) => {
        chart.lastPointer = { x: event.clientX, y: event.clientY };
      };
      maregramChart.onpointerleave = () => {
        chart.lastPointer = null;
      };
      maregramChart.onpointermove = (event) => updateMaregramCursorFromPointer(event);
      maregramChart.onpointerdown = (event) => updateMaregramCursorFromPointer(event, true);
      if (maregramContent.hidden) {
        setMaregramCursorPoint(interpolatePoint(minTime + (maxTime - minTime) * 0.5));
      } else {
        updateMaregramCursor(maregramChart.getBoundingClientRect().left + maregramChart.getBoundingClientRect().width * 0.5);
      }
    };

    const loadMaregram = async () => {
      setMaregramStatus("Chargement marée");
      maregramCoeff.textContent = "Coeff --";
      const [tideResult, coefficientResult, tideEventsResult] = await Promise.allSettled([
        fetchTideData(),
        fetchCoefficient(),
        fetchTideEvents()
      ]);

      if (coefficientResult.status === "fulfilled") {
        maregramCoeff.textContent = formatCoefficient(coefficientResult.value);
      }

      if (tideResult.status === "fulfilled") {
        setMaregramStatus("");
        renderMaregram(tideResult.value, tideEventsResult.status === "fulfilled" ? tideEventsResult.value : null);
      } else {
        setMaregramStatus(`Marée indisponible, courbe demo (${tideResult.reason.message})`);
        renderMaregram(generateDemoTide(tideDate.value));
      }
    };

    observations = await loadObservations();
    renderSpeciesGrid();
    updateSpeciesSelection();
    updateFishingConditionControls();
    tideDate.value = todayString();
    updateDateButton();

    const map = new maplibregl.Map({
      container: "map",
      style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
      center: mapInitialCenter,
      zoom: mapMinZoom,
      minZoom: mapMinZoom,
      maxBounds: mapMaxBounds,
      hash: true,
      pitch: 0,
      minPitch: 0,
      maxPitch: 0,
      bearing: 0,
      dragRotate: false,
      pitchWithRotate: false,
      touchPitch: false
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: {
        enableHighAccuracy: true
      },
      trackUserLocation: true,
      showUserHeading: true,
      fitBoundsOptions: {
        maxZoom: 16
      }
    }), "top-right");
    if (isLocalRuntime) {
      map.addControl(createDebugControl(), "top-right");
    }

    map.dragRotate.disable();
    map.touchZoomRotate.disableRotation();
    map.keyboard?.disableRotation?.();
    const lockMapRotation = () => {
      if (Math.abs(map.getBearing()) > 0.001) {
        map.setBearing(0);
      }
      if (map.getPitch() !== 0) {
        map.setPitch(0);
      }
    };
    map.on("rotate", lockMapRotation);
    map.on("pitch", lockMapRotation);
    lockMapRotation();

    tideStation.addEventListener("change", () => {
      stationManuallySelected = true;
      monthCoefficientCache.clear();
      if (!calendarPanel.hidden) {
        renderCalendar();
      }
      loadMaregram();
    });
    tideDate.addEventListener("change", () => {
      updateDateButton();
      if (!calendarPanel.hidden) {
        const date = selectedInputDate();
        calendarMonthDate = new Date(date.getFullYear(), date.getMonth(), 1);
        renderCalendar();
      }
      loadMaregram();
    });
    prevDay.addEventListener("click", () => shiftTideDate(-1));
    nextDay.addEventListener("click", () => shiftTideDate(1));
    applyDemButton.addEventListener("click", applyDemSelection);
    demTilesSelect.addEventListener("change", () => {
      const isCustomDem = demTilesSelect.value === "custom";
      demTilesCustomInput.hidden = !isCustomDem;
      if (isCustomDem) {
        demTilesCustomInput.focus();
      } else {
        demMaxZoomInput.value = String(inferDemNativeMaxZoomFromValue(demTilesSelect.value));
      }
    });
    demTilesCustomInput.addEventListener("change", () => {
      demMaxZoomInput.value = String(inferDemNativeMaxZoomFromValue(demTilesCustomInput.value));
    });
    demTilesCustomInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        applyDemSelection();
      }
    });
    demMaxZoomInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        applyDemSelection();
      }
    });
    datePickerButton.addEventListener("click", () => {
      if (calendarPanel.hidden) {
        openCalendar();
      } else {
        calendarPanel.hidden = true;
      }
    });
    calendarPrevMonth.addEventListener("click", () => shiftCalendarMonth(-1));
    calendarNextMonth.addEventListener("click", () => shiftCalendarMonth(1));
    window.addEventListener("resize", () => {
      if (!calendarPanel.hidden) {
        positionCalendar();
      }
      if (!observationLibrary.hidden) {
        renderObservationLibrary();
      }
    });
    ignOrthoToggle.addEventListener("change", () => setIgnOrthoVisible(ignOrthoToggle.checked));
    tideOverlayToggle.addEventListener("change", () => setTideOverlayVisible(tideOverlayToggle.checked));
    tideOpacityRange.addEventListener("input", () => setTideOpacity(tideOpacityRange.value));
    observationClose.addEventListener("click", closeObservationDialog);
    observationLibraryToggle.addEventListener("click", () => setObservationLibraryOpen(observationLibrary.hidden));
    observationPagePrev.addEventListener("click", () => {
      observationLibraryPage = Math.max(0, observationLibraryPage - 1);
      renderObservationLibrary();
    });
    observationPageNext.addEventListener("click", () => {
      observationLibraryPage += 1;
      renderObservationLibrary();
    });
    observationForm.querySelector("[data-observation-cancel]").addEventListener("click", closeObservationDialog);
    observationForm.addEventListener("submit", (event) => {
      event.preventDefault();
      saveObservationFromForm();
    });
    observationDelete.addEventListener("click", deleteActiveObservation);
    observationDry.addEventListener("click", () => setPendingFishingCondition("dry"));
    observationWet.addEventListener("click", () => setPendingFishingCondition("wet"));
    observationWaterDepth.addEventListener("input", () => {
      pendingObservationConditionTouched = true;
      pendingObservationMinWaterDepthCm = clampWaterDepthCm(observationWaterDepth.value);
      updateFishingConditionControls();
    });
    document.addEventListener("pointerdown", (event) => {
      if (
        !calendarPanel.hidden &&
        !calendarPanel.contains(event.target) &&
        !datePickerButton.contains(event.target) &&
        !prevDay.contains(event.target) &&
        !nextDay.contains(event.target)
      ) {
        calendarPanel.hidden = true;
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        setDebugPanelOpen(false);
        calendarPanel.hidden = true;
        closeObservationDialog();
        setObservationLibraryOpen(false);
      }
    });

    map.on("contextmenu", (event) => {
      event.preventDefault();
      event.originalEvent?.preventDefault();
      openObservationDialog(event.lngLat);
    });

    const cancelLongPress = () => {
      if (longPressTimer) {
        window.clearTimeout(longPressTimer);
        longPressTimer = null;
      }
      longPressStart = null;
    };

    const pointerLngLat = (event) => {
      const rect = map.getCanvas().getBoundingClientRect();
      return map.unproject([event.clientX - rect.left, event.clientY - rect.top]);
    };

    const mapCanvas = map.getCanvas();
    mapCanvas.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" || event.button !== 0) {
        return;
      }
      longPressStart = { x: event.clientX, y: event.clientY, lngLat: pointerLngLat(event) };
      longPressTimer = window.setTimeout(() => {
        const lngLat = longPressStart?.lngLat;
        cancelLongPress();
        if (lngLat) {
          openObservationDialog(lngLat);
        }
      }, 650);
    });
    mapCanvas.addEventListener("pointermove", (event) => {
      if (!longPressStart) {
        return;
      }
      const distance = Math.hypot(event.clientX - longPressStart.x, event.clientY - longPressStart.y);
      if (distance > 10) {
        cancelLongPress();
      }
    });
    mapCanvas.addEventListener("pointerup", cancelLongPress);
    mapCanvas.addEventListener("pointercancel", cancelLongPress);
    mapCanvas.addEventListener("pointerleave", cancelLongPress);

    map.on("moveend", () => {
      if (!stationManuallySelected && selectNearestStation()) {
        loadMaregram();
      }
    });

    loadStations().then(() => {
      selectNearestStation();
      loadMaregram();
    });

    map.on("load", async () => {
      map.addSource(flatTerrainSourceId, flatTerrainSourceOptions());
      map.addSource(tideReliefSourceId, bathymetrySourceOptions());
      map.setTerrain({ source: flatTerrainSourceId, exaggeration: flatTerrainExaggeration });

      addIgnOrthoSourceAndLayer();

      map.addLayer({
        id: "tide-overlay",
        type: "color-relief",
        source: tideReliefSourceId,
        layout: {
          visibility: tideOverlayToggle.checked ? "visible" : "none"
        },
        paint: {
          "color-relief-opacity": 1,
          "color-relief-color": tideColorExpression(currentTideDemLevel, tideLayerOpacity),
          "resampling": "nearest"
        }
      });

      map.addLayer({
        id: "tide-foam",
        type: "color-relief",
        source: tideReliefSourceId,
        layout: {
          visibility: tideOverlayToggle.checked ? "visible" : "none"
        },
        paint: {
          "color-relief-opacity": 1,
          "color-relief-color": tideFoamExpression(currentTideDemLevel, tideLayerOpacity),
          "resampling": "nearest"
        }
      });
      setTideLevel(currentTideDemLevel, currentTideHeight);

      map.addSource("observations", {
        type: "geojson",
        data: observationFeatureCollection()
      });

      try {
        await addSpeciesMarkerImages();
      } catch (error) {
        console.warn("Unable to load observation species atlas", error);
      }

      if (map.hasImage(`species-${defaultSpeciesId}`)) {
        map.addLayer({
          id: "observation-icons",
          type: "symbol",
          source: "observations",
          layout: {
            "icon-image": speciesIconExpression,
            "icon-size": 1.84,
            "icon-anchor": "bottom",
            "icon-allow-overlap": true,
            "icon-ignore-placement": true
          }
        });
      } else {
        map.addLayer({
          id: "observation-icons",
          type: "circle",
          source: "observations",
          paint: {
            "circle-radius": 12,
            "circle-color": "#2563eb",
            "circle-stroke-color": "#ffffff",
            "circle-stroke-width": 3
          }
        });
      }

      map.on("click", "observation-icons", (event) => {
        const feature = event.features?.[0];
        const observation = observations.find((item) => item.id === feature?.properties?.id);
        if (observation) {
          openObservationDialog({ lng: observation.lon, lat: observation.lat }, observation);
        }
      });
      map.on("mouseenter", "observation-icons", () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", "observation-icons", () => {
        map.getCanvas().style.cursor = "";
      });

      map.once("idle", clearObservationElevationCache);

      if (chart.active) {
        setMaregramReadout(chart.active);
      }
    });
  </script>
</body>
</html>
