<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MaRe</title>
  <link rel="icon" type="image/png" sizes="180x180" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link href="https://unpkg.com/maplibre-gl@6.0.0-8/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      height: 100lvh;
      margin: 0;
      overflow: hidden;
      background: #082f3c;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      height: 100lvh;
      margin: 0;
    }

    .terrain-query-map {
      position: fixed;
      left: -256px;
      top: -256px;
      width: 128px;
      height: 128px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

    .maregram-panel,
    .observation-dialog {
      --notebook-grid: 28px;
      --notebook-line: rgba(100, 116, 139, 0.24);
      --notebook-cross: rgba(100, 116, 139, 0.18);
      --notebook-ink: #0f172a;
      --notebook-muted: #475569;
      --notebook-accent: #1d4ed8;
      border: 1px solid rgba(100, 116, 139, 0.28);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(30, 64, 175, 0.14) 0 5px, transparent 5px),
        rgba(255, 253, 244, 0.97);
      color: var(--notebook-ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.24);
    }

    .maregram-panel button,
    .observation-dialog button,
    .maregram-panel input,
    .observation-dialog input {
      font-family: inherit;
    }

    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right {
      display: none;
    }

    .maplibregl-ctrl-top-right {
      top: calc(env(safe-area-inset-top) + 10px);
      right: calc(env(safe-area-inset-right) + 10px);
    }

    .maregram-panel {
      position: absolute;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 18px);
      transform: translateX(-50%);
      z-index: 1;
      --panel-view-height: 266px;
      display: grid;
      gap: 8px;
      width: min(820px, calc(100% - 24px));
      max-width: 820px;
      padding: 10px 12px 12px;
      font-size: 13px;
      line-height: 1.25;
      background:
        linear-gradient(90deg, var(--notebook-cross) 1px, transparent 1px),
        linear-gradient(var(--notebook-line) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 64, 175, 0.14) 0 5px, transparent 5px),
        rgba(255, 253, 244, 0.97);
      background-size: var(--notebook-grid) var(--notebook-grid), var(--notebook-grid) var(--notebook-grid), auto, auto;
      -webkit-user-select: none;
      user-select: none;
    }

    .maregram-panel[hidden] {
      display: none;
    }

    .maregram-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .maregram-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .date-switch-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: auto;
    }

    .date-control {
      position: relative;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .date-step,
    .date-button,
    .view-switch-button {
      appearance: none;
      min-height: 32px;
      border: 1px solid rgba(51, 65, 85, 0.28);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--notebook-ink);
      font: inherit;
      cursor: pointer;
    }

    .date-step {
      width: 32px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }

    .date-button {
      min-width: 170px;
      padding: 0 10px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .view-switch-button {
      min-width: 78px;
      padding: 0 10px;
      font-variant-numeric: tabular-nums;
    }

    .date-button,
    .view-switch-button {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
    }

    .view-switch-button-active {
      border-color: rgba(37, 99, 235, 0.62);
      background: rgba(219, 234, 254, 0.82);
      color: #1d4ed8;
    }

    .date-step:hover,
    .date-step:focus-visible,
    .date-button:hover,
    .date-button:focus-visible,
    .view-switch-button:hover,
    .view-switch-button:focus-visible {
      border-color: rgba(37, 99, 235, 0.62);
      outline: none;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .date-native {
      position: absolute;
      left: 42px;
      bottom: -2px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .date-calendar {
      position: fixed;
      left: var(--calendar-left, 12px);
      bottom: var(--calendar-bottom, 76px);
      z-index: 7;
      width: min(410px, calc(100vw - 32px));
      box-sizing: border-box;
      height: min(438px, calc(100dvh - 96px));
      border: 1px solid rgba(100, 116, 139, 0.28);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(100, 116, 139, 0.18) 1px, transparent 1px),
        linear-gradient(rgba(100, 116, 139, 0.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 64, 175, 0.14) 0 5px, transparent 5px),
        rgba(255, 253, 244, 0.98);
      background-size: 28px 28px, 28px 28px, auto, auto;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.24);
      overflow: hidden;
      color: #0f172a;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }

    .date-calendar[hidden] {
      display: none;
    }

    .calendar-header {
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      align-items: center;
      height: 37px;
      border-bottom: 1px solid rgba(100, 116, 139, 0.2);
      background: rgba(255, 253, 244, 0.78);
      color: #0f172a;
    }

    .calendar-month {
      padding: 9px 8px;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      text-transform: capitalize;
    }

    .calendar-nav {
      appearance: none;
      height: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }

    .calendar-nav:hover,
    .calendar-nav:focus-visible {
      background: rgba(255, 255, 255, 0.12);
      outline: none;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      height: calc(100% - 37px);
      background: rgba(100, 116, 139, 0.22);
    }

    .calendar-column {
      display: grid;
      grid-template-rows: repeat(12, 1fr);
      background: rgba(255, 253, 244, 0.82);
    }

    .calendar-column-head,
    .calendar-day {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: start;
      min-height: 0;
      padding: 3px 9px;
      border: 0;
      color: #0f172a;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.05;
      overflow: hidden;
    }

    .calendar-column-head {
      background: rgba(255, 253, 244, 0.88);
      font-weight: 800;
    }

    .calendar-day {
      appearance: none;
      width: 100%;
      cursor: pointer;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }

    .calendar-day:hover,
    .calendar-day:focus-visible,
    .calendar-day-selected {
      outline: 2px solid rgba(37, 99, 235, 0.72);
      outline-offset: -2px;
    }

    .calendar-day-name {
      white-space: nowrap;
    }

    .calendar-day-coeff {
      text-align: right;
      line-height: 1.05;
      white-space: pre-line;
    }

    .calendar-loading {
      grid-column: 1 / -1;
      box-sizing: border-box;
      min-height: 100%;
      padding: 18px;
      background: rgba(255, 253, 244, 0.9);
      color: #475569;
      text-align: center;
    }

    .maregram-coeff {
      margin-left: auto;
      color: var(--notebook-accent);
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .maregram-content {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 8px;
      height: var(--panel-view-height);
      min-height: 0;
      overflow: hidden;
    }

    .tide-events {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .tide-event {
      appearance: none;
      display: grid;
      gap: 2px;
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid rgba(100, 116, 139, 0.24);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.58);
      color: var(--notebook-ink);
      cursor: pointer;
      font: inherit;
      font-variant-numeric: tabular-nums;
      text-align: left;
    }

    .tide-event:hover,
    .tide-event:focus-visible,
    .tide-event-active {
      border-color: rgba(30, 64, 175, 0.54);
      background: rgba(255, 255, 255, 0.84);
      outline: none;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .tide-event-type {
      color: var(--notebook-muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .tide-event-time {
      color: var(--notebook-ink);
      font-size: 17px;
      font-weight: 800;
    }

    .tide-event-height {
      color: var(--notebook-muted);
      font-size: 12px;
    }

    .maregram-readout {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--notebook-muted);
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .maregram-chart {
      justify-self: center;
      width: min(100%, 784px);
      height: 100%;
      min-height: 0;
      touch-action: none;
      border-radius: 5px;
      background: transparent;
    }

    .maregram-chart text {
      font-family: inherit;
      font-weight: 700;
    }

    .maregram-axis {
      stroke: rgba(15, 23, 42, 0.62);
      stroke-width: 1.2;
    }

    .maregram-path {
      fill: none;
      stroke: #1d4ed8;
      stroke-width: 2.4;
    }

    .maregram-water {
      fill: rgba(37, 99, 235, 0.12);
    }

    .maregram-cursor {
      stroke: #2563eb;
      stroke-width: 2;
    }

    .maregram-point {
      fill: #ffffff;
      stroke: #2563eb;
      stroke-width: 2;
    }

    .maregram-status {
      color: #64748b;
    }

    .maregram-status:empty {
      display: none;
    }

    .app-logo {
      position: absolute;
      top: calc(env(safe-area-inset-top) + 12px);
      left: calc(env(safe-area-inset-left) + 12px);
      z-index: 2;
      width: 220px;
      height: auto;
      max-height: 120px;
      object-fit: contain;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }

    .debug-panel {
      position: absolute;
      top: 154px;
      right: 12px;
      z-index: 2;
      display: grid;
      gap: 9px;
      width: 230px;
      padding: 10px;
      border: 1px solid rgba(30, 41, 59, 0.2);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.92);
      color: #1f2937;
      font: 13px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.14);
      -webkit-user-select: none;
      user-select: none;
    }

    .debug-panel[hidden] {
      display: none;
    }

    .debug-field {
      display: grid;
      gap: 5px;
      color: #334155;
      font-size: 12px;
    }

    .debug-field input,
    .debug-field select {
      min-height: 30px;
      min-width: 0;
      border: 1px solid rgba(51, 65, 85, 0.28);
      border-radius: 5px;
      background: #ffffff;
      color: #1f2937;
      font: 13px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .debug-apply-button {
      appearance: none;
      min-height: 31px;
      border: 1px solid rgba(37, 99, 235, 0.42);
      border-radius: 5px;
      background: #2563eb;
      color: #ffffff;
      font: 700 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }

    .debug-apply-button:hover,
    .debug-apply-button:focus-visible {
      background: #1d4ed8;
      outline: none;
    }

    .ortho-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      cursor: pointer;
    }

    .ortho-toggle input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: #2563eb;
    }

    .debug-range-control {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 5px 8px;
      align-items: center;
      min-width: 190px;
      color: #334155;
      font-size: 12px;
    }

    .debug-range-control input {
      grid-column: 1 / -1;
      width: 100%;
      margin: 0;
      accent-color: #2563eb;
    }

    .debug-range-value {
      color: #1f2937;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    .debug-control-button svg {
      display: block;
      width: 18px;
      height: 18px;
      margin: auto;
    }

    .observation-dialog {
      position: fixed;
      z-index: 9;
      font-size: 13px;
      line-height: 1.25;
      -webkit-user-select: text;
      user-select: text;
    }

    .observation-dialog[hidden],
    .maregram-content[hidden],
    .observation-library[hidden] {
      display: none;
    }

    .observation-dialog {
      left: 50%;
      top: 50%;
      width: min(360px, calc(100vw - 28px));
      transform: translate(-50%, -50%);
      background:
        linear-gradient(90deg, rgba(100, 116, 139, 0.18) 1px, transparent 1px),
        linear-gradient(rgba(100, 116, 139, 0.24) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 64, 175, 0.14) 0 5px, transparent 5px),
        rgba(255, 253, 244, 0.97);
      background-size: var(--notebook-grid) var(--notebook-grid), var(--notebook-grid) var(--notebook-grid), auto, auto;
    }

    .observation-form {
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    .observation-titlebar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 28px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(100, 116, 139, 0.18);
    }

    .observation-titlebar strong {
      margin-right: auto;
      color: var(--notebook-ink);
      font-size: 18px;
      font-weight: 800;
    }

    .observation-close,
    .observation-secondary,
    .observation-primary,
    .observation-danger {
      appearance: none;
      min-height: 32px;
      border: 1px solid rgba(51, 65, 85, 0.25);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--notebook-ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      cursor: pointer;
    }

    .observation-close {
      width: 30px;
      min-height: 30px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }

    .observation-primary {
      border-color: rgba(37, 99, 235, 0.5);
      background: rgba(29, 78, 216, 0.9);
      color: #ffffff;
    }

    .observation-danger {
      border-color: rgba(220, 38, 38, 0.34);
      color: #b91c1c;
    }

    .observation-field {
      display: grid;
      gap: 5px;
      color: var(--notebook-muted);
      font-size: 12px;
      font-weight: 800;
    }

    .observation-field input,
    .observation-field select {
      box-sizing: border-box;
      width: 100%;
      min-height: 32px;
      border: 1px solid rgba(51, 65, 85, 0.28);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.74);
      color: var(--notebook-ink);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.25;
    }

    .species-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .species-option {
      appearance: none;
      display: grid;
      gap: 4px;
      min-width: 0;
      padding: 4px;
      border: 1px solid rgba(51, 65, 85, 0.18);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.58);
      color: var(--notebook-ink);
      font-family: inherit;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.05;
      cursor: pointer;
    }

    .species-option-selected {
      border-color: rgba(37, 99, 235, 0.72);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14);
    }

    .condition-toggle {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .condition-option {
      appearance: none;
      min-height: 34px;
      border: 1px solid rgba(51, 65, 85, 0.22);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.64);
      color: var(--notebook-ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.15;
      cursor: pointer;
    }

    .condition-option-active {
      border-color: rgba(37, 99, 235, 0.72);
      background: rgba(219, 234, 254, 0.82);
      color: #1d4ed8;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14);
    }

    .observation-range-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .observation-range-label strong {
      color: #1d4ed8;
      font-size: 12px;
    }

    .observation-field[hidden] {
      display: none;
    }

    .species-option-image,
    .species-thumb {
      background-image: url("data/estranv2.png");
      background-repeat: no-repeat;
      background-size: 400% 400%;
    }

    .species-option-image {
      aspect-ratio: 1;
      border-radius: 4px;
      background-color: transparent;
    }

    .species-option-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .observation-position {
      color: var(--notebook-muted);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .observation-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .observation-library {
      --notebook-page-lines: 8;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 8px;
      height: var(--panel-view-height);
      min-height: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    .observation-list {
      display: grid;
      gap: 0;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      padding: 0 2px 0 8px;
    }

    .observation-page-controls {
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      align-items: center;
      gap: 8px;
      min-height: 34px;
    }

    .observation-page-button {
      appearance: none;
      width: 34px;
      height: 30px;
      border: 1px solid rgba(51, 65, 85, 0.24);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.72);
      color: #0f172a;
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }

    .observation-page-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .observation-page-label {
      color: #475569;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .observation-location-group {
      display: grid;
      gap: 0;
    }

    .observation-location-page {
      display: grid;
      gap: 0;
      align-content: start;
      min-height: 100%;
    }

    .observation-location-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: var(--notebook-grid);
      margin: 0;
      padding: 0 6px;
      color: #0f172a;
      font-size: 15px;
      font-weight: 800;
      line-height: var(--notebook-grid);
    }

    .observation-location-count {
      margin-left: auto;
      color: #64748b;
      font-size: 11px;
      font-weight: 800;
      line-height: var(--notebook-grid);
    }

    .observation-entry-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: calc(var(--notebook-grid) / 2);
      row-gap: 0;
    }

    .observation-empty {
      padding: 12px;
      border: 1px dashed rgba(51, 65, 85, 0.24);
      border-radius: 5px;
      color: #64748b;
      text-align: center;
    }

    .observation-card {
      display: grid;
      grid-template-columns: 48px 1fr;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: calc(var(--notebook-grid) * 2);
      padding: 0 6px 0 2px;
      border: 0;
      border-radius: 0;

AAAAAYAADAAAIABAAAMAABgAAAAAwAAGAAAwAAAAHcWtddZxTTuf5gAAAAASUVORK5CYII=";
    const flatTerrainTileBytes = Uint8Array.from(atob(flatTerrainTileBase64), (char) => char.charCodeAt(0));

    const waitForTerrainQueryIdle = (queryMap, timeoutMs = 3500) => new Promise((resolve) => {
      let settled = false;
      const finish = () => {
        if (settled) {
          return;
        }
        settled = true;
        clearTimeout(timeoutId);
        queryMap.off("idle", finish);
        resolve();
      };
      const timeoutId = setTimeout(finish, timeoutMs);
      queryMap.once("idle", finish);
      requestAnimationFrame(() => {
        if (!settled && queryMap.loaded?.() && queryMap.areTilesLoaded?.()) {
          finish();
        }
      });
      queryMap.triggerRepaint?.();
    });

    const ensureTerrainQueryMap = () => {
      if (terrainQueryReadyPromise) {
        return terrainQueryReadyPromise;

      terrainQueryReadyPromise = new Promise((resolve) => {
        const container = document.createElement("div");
        container.className = "terrain-query-map";

          zoom: Math.min(activeDemMaxZoom, 15),

        queryMap.on("load", () => {
          queryMap.addSource(terrainQuerySourceId, bathymetrySourceOptions());
          queryMap.setTerrain({ source: terrainQuerySourceId, exaggeration: 1 });
          resolve(queryMap);
        });

        queryMap.on("error", (event) => {

    const queryTerrainElevationWithMapLibre = (lon, lat) => {
      const task = terrainQueryQueue

              center: [lon, lat],
              zoom: Math.min(activeDemMaxZoom, 18),
              bearing: 0,
              pitch: 0

            await waitForTerrainQueryIdle(queryMap);
            const elevation = queryMap.queryTerrainElevation([lon, lat]);
            if (demDebug) {

            return isValidDemElevation(elevation) ? elevation : null;
          } catch (error) {

    const observationStorageKey = "mare-observations-v1";

    const wetDefaultSpeciesIds = new Set(["lancon", "bar", "eperlan", "dorade"]);

    const clampWaterDepthCm = (value) => {
      const depth = Number(value);
      if (!Number.isFinite(depth)) {
        return 50;
      }
      return Math.max(0, Math.min(200, Math.round(depth / 10) * 10));
    };

    const defaultFishingConditionForSpecies = (speciesId) => (
      wetDefaultSpeciesIds.has(speciesForId(speciesId).id)

    const normalizeWaterState = (value) => value === "wet" ? "wet" : "dry";

    const isInsideBathymetryBounds = (lon, lat) =>
      lon >= bathymetryBounds[0] &&

      lat >= bathymetryBounds[1] &&
      lat <= bathymetryBounds[3];

    const sampleDemElevation = async (observation) => {
      const lon = Number(observation.lon);
      const lat = Number(observation.lat);
      if (!Number.isFinite(lon) || !Number.isFinite(lat) || !isInsideBathymetryBounds(lon, lat)) {
        return null;
      }

      const cacheKey = `${demSource.type}/${demSource.url}/${demTileVersion}/${activeDemMaxZoom}/${lon.toFixed(7)}/${lat.toFixed(7)}`;
      if (demSampleCache.has(cacheKey)) {
        return demSampleCache.get(cacheKey);
      }

      const terrainElevation = await queryTerrainElevationWithMapLibre(lon, lat);
      demSampleCache.set(cacheKey, terrainElevation);
      return terrainElevation;
    };

    const fishingScore = (observation, demElevation, point) => {
      const waterDepth = point.height + selectedZhToDemOffset() - demElevation;
      if (normalizeWaterState(observation.waterState) === "wet") {
        return waterDepth - clampWaterDepthCm(observation.minWaterDepthCm) / 100;
      }
      return -waterDepth;
    };

    const crossingTime = (previousPoint, currentPoint, previousScore, currentScore) => {
      const start = previousPoint.time.getTime();
      const end = currentPoint.time.getTime();
      const ratio = previousScore === currentScore
        ? 0
        : Math.max(0, Math.min(1, (0 - previousScore) / (currentScore - previousScore)));
      return new Date(start + (end - start) * ratio);
    };

    const fishingIntervals = (observation, demElevation) => {
      if (!chart.data.length || demElevation == null) {
        return [];
      }
      const intervals = [];
      let previousPoint = chart.data[0];
      let previousScore = fishingScore(observation, demElevation, previousPoint);
      let isActive = previousScore >= 0;
      let intervalStart = isActive ? previousPoint.time : null;

      for (let index = 1; index < chart.data.length; index += 1) {
        const point = chart.data[index];
        const score = fishingScore(observation, demElevation, point);
        const active = score >= 0;
        if (active !== isActive) {
          const transition = crossingTime(previousPoint, point, previousScore, score);
          if (active) {
            intervalStart = transition;
          } else if (intervalStart) {
            intervals.push({ start: intervalStart, end: transition });
            intervalStart = null;
          }
        }
        previousPoint = point;
        previousScore = score;
        isActive = active;
      }

      if (isActive && intervalStart) {
        intervals.push({ start: intervalStart, end: chart.data[chart.data.length - 1].time });
      }

      return intervals.filter((interval) => interval.end.getTime() - interval.start.getTime() >= 5 * 60000);
    };

    const formatFishingTime = (time) =>
      time.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

    const daytimeFishingWindow = () => {
      const date = chart.data[0]?.time;
      if (!date) {
        return null;
      }
      const start = new Date(date);
      start.setHours(6, 0, 0, 0);
      const end = new Date(date);
      end.setHours(22, 0, 0, 0);
      return { start, end };
    };

    const clipFishingIntervalsToDaytime = (intervals) => {
      const window = daytimeFishingWindow();
      if (!window) {
        return [];
      }
      return intervals
        .map((interval) => ({
          start: new Date(Math.max(interval.start.getTime(), window.start.getTime())),
          end: new Date(Math.min(interval.end.getTime(), window.end.getTime()))
        }))
        .filter((interval) => interval.end.getTime() - interval.start.getTime() >= 5 * 60000);
    };

    const formatFishingIntervals = (intervals) => {
      if (!chart.data.length) {
        return "Créneau indisponible";
      }
      const visibleIntervals = clipFishingIntervalsToDaytime(intervals);
      if (!visibleIntervals.length) {
        return "Aucun créneau de jour";
      }
      const window = daytimeFishingWindow();
      if (
        visibleIntervals.length === 1 &&
        window &&
        visibleIntervals[0].start.getTime() <= window.start.getTime() + 10 * 60000 &&
        visibleIntervals[0].end.getTime() >= window.end.getTime() - 10 * 60000
      ) {
        return "06:00-22:00";
      }
      return visibleIntervals
        .map((interval) => `${formatFishingTime(interval.start)}-${formatFishingTime(interval.end)}`)
        .join(" / ");
    };

    const fishingScheduleLabel = async (observation) => {

      if (!isInsideBathymetryBounds(Number(observation.lon), Number(observation.lat))) {
        return "Hors emprise bathymétrie";
      }
      const elevation = await sampleDemElevation(observation);
      if (elevation == null) {
        return "Cote DEM indisponible";

      return formatFishingIntervals(fishingIntervals(observation, elevation));

    const observationFeatureCollection = () => ({

    const saveObservations = () => {

    const normalizeObservations = (items) => {
      if (!Array.isArray(items)) {
        return [];
      }
      return items
        .filter((item) => Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lon)))
        .map((item) => {
          const speciesId = speciesById[item.speciesId] ? String(item.speciesId) : defaultSpeciesId;
          const defaults = defaultFishingConditionForSpecies(speciesId);
          const waterState = item.waterState ? normalizeWaterState(item.waterState) : defaults.waterState;
          const minWaterDepthCm = item.minWaterDepthCm == null
            ? defaults.minWaterDepthCm
            : clampWaterDepthCm(item.minWaterDepthCm);
          return {
            id: String(item.id || createObservationId()),
            title: String(item.title || item.location || "Observation"),
            speciesId,
            waterState,
            minWaterDepthCm,
            lat: Number(item.lat),
            lon: Number(item.lon),
            createdAt: String(item.createdAt || new Date().toISOString()),
            updatedAt: String(item.updatedAt || item.createdAt || new Date().toISOString())
          };

    const loadLocalObservations = () => {

    const loadBundledObservations = async () => {
      try {
        const response = await fetch(`${bundledObservationsUrl}?v=2026-05-14`, { cache: "no-store" });
        if (!response.ok) {
